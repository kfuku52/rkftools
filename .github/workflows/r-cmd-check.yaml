name: R-CMD-check

on:
  push:
    branches: [master, main]
    paths:
      - 'R/**'
      - 'tests/**'
      - 'man/**'
      - 'tools/**'
      - 'DESCRIPTION'
      - 'NAMESPACE'
      - 'NEWS.md'
      - 'Makefile'
      - '.Rbuildignore'
      - '.github/workflows/**'
  pull_request:
    branches: [master, main]
    paths:
      - 'R/**'
      - 'tests/**'
      - 'man/**'
      - 'tools/**'
      - 'DESCRIPTION'
      - 'NAMESPACE'
      - 'NEWS.md'
      - 'Makefile'
      - '.Rbuildignore'
      - '.github/workflows/**'
  workflow_dispatch:
    inputs:
      compatibility_only:
        description: 'Only run the five extended configurations (base checks already passed)'
        type: boolean
        default: false
  schedule:
    - cron: '17 2 * * 1'

permissions:
  contents: read

concurrency:
  group: r-cmd-check-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  R-CMD-check:
    if: '!inputs.compatibility_only'
    name: ubuntu-latest / R ${{ matrix.r-version }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - r-version: '4.1'
            full: false
            coverage: false
          - r-version: release
            full: true
            coverage: true
    uses: ./.github/workflows/r-check-job.yaml
    with:
      os: ubuntu-latest
      r-version: ${{ matrix.r-version }}
      full: ${{ matrix.full }}
      coverage: ${{ matrix.coverage }}
      as-cran: ${{ matrix.full && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') }}
  compatibility:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    name: ${{ matrix.os }} / R ${{ matrix.r-version }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            r-version: '4.2'
          - os: ubuntu-latest
            r-version: '4.3'
          - os: ubuntu-latest
            r-version: devel
          - os: macos-latest
            r-version: release
          - os: windows-latest
            r-version: release
    uses: ./.github/workflows/r-check-job.yaml
    with:
      os: ${{ matrix.os }}
      r-version: ${{ matrix.r-version }}
