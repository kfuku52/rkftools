name: R-CMD-check

on:
  push:
    branches:
      - master
      - main
  pull_request:
    branches:
      - master
      - main

permissions:
  contents: read

concurrency:
  group: r-cmd-check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  R-CMD-check:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            r-version: "4.1"
            force-suggests: "false"
            optional-packages: ""
          - os: ubuntu-latest
            r-version: "4.2"
            force-suggests: "false"
            optional-packages: ""
          - os: ubuntu-latest
            r-version: "4.3"
            force-suggests: "false"
            optional-packages: ""
          - os: ubuntu-latest
            r-version: release
            force-suggests: "true"
            optional-packages: |-
              any::PhylogeneticEM
              any::Rphylopars
          - os: macos-latest
            r-version: release
            force-suggests: "false"
            optional-packages: ""
          - os: windows-latest
            r-version: release
            force-suggests: "false"
            optional-packages: ""
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    name: ${{ matrix.os }} / R ${{ matrix.r-version }}
    env:
      _R_CHECK_FORCE_SUGGESTS_: ${{ matrix.force-suggests }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: r-lib/actions/setup-r@d3c5be51b12e724e68f33216ca3c148b66d5f0b6
        with:
          r-version: ${{ matrix.r-version }}
      - uses: r-lib/actions/setup-r-dependencies@d3c5be51b12e724e68f33216ca3c148b66d5f0b6
        with:
          extra-packages: |
            any::rcmdcheck
            ${{ matrix.optional-packages }}
          dependencies: '"hard"'
          needs: check
      - uses: r-lib/actions/check-r-package@d3c5be51b12e724e68f33216ca3c148b66d5f0b6
        with:
          args: 'c("--no-manual")'
